name: 오늘의 말씀 자동 갱신

on:
  schedule:
    # 15:00 UTC = 00:00 KST
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci --omit=dev

      - name: 가톨릭굿뉴스에서 오늘의 말씀 가져와 Firestore에 반영
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/update-todayword.js
